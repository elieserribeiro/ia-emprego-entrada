[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painelia"
version = "1.0.0"
description = "Painel: exposição da ocupação à IA generativa (OIT 2025 + Novo CAGED)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "pyarrow>=15"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "openai>=1.40"]
treino = ["sentence-transformers>=3.0", "torch>=2.2"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools]
packages = ["painelia"]
