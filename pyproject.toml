[project]
name = "iaemprego"
version = "0.1.0"
description = "IA generativa e emprego de entrada no Brasil (Novo CAGED, PNAD Contínua, índice OIT 2025)"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1", "pandas>=2.1", "pyarrow>=15", "pyfixest>=0.70", "py7zr>=0.21",
  "requests>=2.31", "pyyaml>=6", "matplotlib>=3.8", "openpyxl>=3.1",
]
[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
